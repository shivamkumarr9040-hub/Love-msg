<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#fff0f3;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#fff0f3;padding:24px 12px;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr><td style="padding:0;">
          <!-- Photo: pehle email-banner.jpg ko GitHub repo me upload karo,
               phir neeche wali URL me apna repo naam / branch check kar lo -->
          <img src="https://raw.githubusercontent.com/shivamkumarr9040-hub/Love-msg/main/email-banner.jpg" alt="Love-msg" width="480" style="display:block;width:100%;height:auto;border:0;">
        </td></tr>
        <tr><td align="center" style="padding:28px 28px 8px;">
          <h1 style="margin:0;font-size:22px;color:#3d1220;">Your OTP is here</h1>
          <p style="margin:12px 0 0;font-size:15px;color:#555;line-height:1.5;">Enter this code in Love-msg to finish creating your account.</p>
        </td></tr>
        <tr><td align="center" style="padding:20px 28px;">
          <div style="display:inline-block;background:linear-gradient(120deg,#e91e63,#ff4d6d);color:#ffffff;font-size:30px;font-weight:bold;letter-spacing:8px;padding:16px 24px 16px 32px;border-radius:12px;">{{ .Token }}</div>
        </td></tr>
        <tr><td align="center" style="padding:0 28px 28px;">
          <p style="margin:0;font-size:13px;color:#888;">This code expires soon. Take care ❤️</p>
          <p style="margin:16px 0 0;font-size:12px;color:#aaa;">If you didn't ask for this, just ignore this email.</p>
        </td></tr>
      </table>
      <p style="font-size:12px;color:#c98a9b;margin-top:16px;">Take care ❤️</p>
    </td></tr>
  </table>
</body>
</html>
